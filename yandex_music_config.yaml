# Yandex Music Player Configuration
# Настройки для yandex_playlist_player.py

# Path to mpv player (Windows)
# On Linux/macOS use just "mpv"
player_path: "C:\\Program Files\\MPV Player\\mpv.exe"

# Volume adjustment for music (in dB, mpv format)
# Examples: "-3dB" (quieter), "+0dB" (normal), "+3dB" (louder)
volume: 50
