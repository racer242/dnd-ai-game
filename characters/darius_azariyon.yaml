class_features:
  - name: "Божественное чувство"
    description: >
      До конца своего следующего хода знаете местоположение всех исчадий,
      небожителей и нежити в пределах 60 футов, не имеющих полного укрытия.
      Вы знаете тип любого существа, чьё присутствие вы чувствуете.
      Вы также обнаруживаете присутствие мест и предметов, которые были освящены
      или осквернены. Можно использовать 1 + ХАР раз. Потом продолжительный отдых.
  - name: "Наложение рук"
    description: >
      Вы можете восстанавливать любое количество хитов из запаса, = уровень × 5.
      Потом продолжительный отдых.
  - name: "Божественная кара"
    description: >
      Если вы попадаете по существу рукопашной атакой оружием, вы можете потратить
      одну ячейку заклинания для дополнительного урона, он равен 2к8 за ячейку 1 уровня,
      плюс 1к8 за каждый уровень ячейки выше, до максимума 5к8.
      Урон увеличивается на 1к8, если цель нежить или исчадие, максимум 6к8.
  - name: "Боевой стиль (Защита)"
    description: >
      Если существо, которое вы видите, атакует не вас, а другое существо,
      находящееся в пределах 5 футов от вас, вы можете Реакцией создать помеху
      его броску атаки. Для этого вы должны использовать щит.
  - name: "Выносливость камня"
    description: >
      Когда вы получаете урон, вы можете реакцией кинуть кость к12.
      Добавьте ваш модификатор Телосложения к выпавшему числу и уменьшите
      общее количество урона на получившийся результат. Потом короткий+ отдых.
  - name: "Мощное телосложение"
    description: "Вы считаетесь на один размер больше."
  - name: "Рожденный в горах"
    description: >
      Вы получаете сопротивление к урону холодом. Вы также привычны к большой высоте,
      включая высоту больше 20 000 футов.
  - name: "Божественное здоровье"
    description: "Божественная магия, текущая через вас, даёт иммунитет к болезням."
  - name: "Праведное восстановление"
    description: >
      Бонусным действием вы касаетесь своего священного символа, произносите молитву
      и возвращаете одну потраченную ячейку заклинаний, уровень которой не превышает
      половины вашего БМ. Вы можете использовать это умение количество раз, зависящее
      от уровня в этом классе: один раз на 3-м уровне, два раза на 7-м уровне,
      три раза на 15-м уровне. Потом продолжительный отдых.
  - name: "Божественный любимчик"
    description: >
      Вы знаете заговор Чудотворство и заклинание Волна грома, которое можно
      использовать 1 раз бесплатно, потом продолжительный отдых.
  - name: "Дополнительная атака"
    description: >
      Если вы в свой ход совершаете действие Атака, вы можете совершить две атаки вместо одной.
  - name: "Аура защиты"
    description: >
      Если вы или друж. существо в пределах 10 футов должны совершить спасбросок,
      это существо получает бонус вашей ХАР (мин. +1).

channel_divinity:
  - name: "Предопределение"
    description: >
      Вы можете использовать свой Божественный канал, чтобы призвать силу божества,
      которое дарует благословение вашим союзникам. Когда существо в пределах 60 футов
      от вас, которое вы видите, делает спасбросок, вы можете использовать свою реакцию,
      чтобы предоставить существу преимущество в спасброске, используя ваш Божественный канал.
      Если эффект позволяет существу получить только половину урона при успешном спасброске,
      существо вместо этого не получает никакого урона, и только четверть урона при неудаче.
  - name: "Поцелуй несчастья"
    description: >
      Действием ваш Божественный канал может быть использован, дабы наслать на ваших
      врагов неудачу. Каждое недружественное существо, которое может видеть или слышать
      вас и находится в пределах 30 футов от вас, должно сделать спасбросок Харизмы,
      получив помеху на все спасброски в течение 1 минуты после провала.
      Вы должны быть в сознании, чтобы эффект способности сработал. Потом короткий+ отдых.

additional_features:
  - name: "Удача смелых"
    description: >
      Один раз в ход, когда вы промахиваетесь Атакой, вы можете вместо этого попасть по врагу.
      Тогда существо получает дополнительный урон излучением, равный вашему модификатору ХАР.
      Вы можете использовать эту способность ХАР раз. Потом продолжительный отдых.

tools_of_torture:
  description: >
    В этой сумке находятся различные небольшие инструменты, с помощью которых можно
    дробить, колоть и резать, причиняя максимальную боль. Владение этими инструментами
    дает следующие преимущества:
  exhaustion: >
    Использование этих инструментов в течение 1 часа на опутанном существе приводит
    к тому, что оно получает 1 степень истощения, после чего вы должны совершить
    проверку Ловкости (Орудия пыток). Сл равна 20 - модификатор Телосложения существа.
    В случае провала существо получает 10 урона выбранного вами типа: дробящий,
    колющий или рубящий.
  intimidation: >
    Когда вы совершаете проверку Запугивания против существа, на котором вы использовали
    эти инструменты, вы получаете бонус, равный вашему бонусу мастерства + удвоенная
    степень истощения, который есть у этого существа.

personality:
  traits: >
    Я склонен смотреть на вещи в черно-белых тонах, не оставляя места для двусмысленности.
    Несмотря на суровый внешний вид, я глубоко сострадателен и желаю защитить невинных.
  ideals: "Те, кто вредит или лжёт Церкви, должны быть привлечены к ответственности"
  bonds: "Я стремлюсь обратить или спасти тех, кто сбился с пути."
  flaws: >
    Я иногда прибегаю к крайним мерам во имя сохранения Церкви, что может привести
    к ненужным конфликтам.

organization:
  description: >
    Как инквизитор Лучезарной церкви, вы пользуетесь определенным уважением и страхом
    среди членов церкви и посторонних, признающих её авторитет. Вы можете использовать
    свой авторитет, чтобы получить доступ к ресурсам, информации или помощи тех,
    кто боится гнева Церкви, почитает ее власть или следует ее учениям.

background: ""
notes: []
