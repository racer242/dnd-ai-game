spellcasting:
  source: "Скрытная роща (способность монаха)"
  dc: 13
  attack_bonus: 5
  spells:
    - name: "Беспорядочный рост"
      level: 1
      cost: "2 очка ци"
      description: >
        Бонусное действие, 60 футов, 1 минута.
        Зона с густой растительностью радиусом 10 футов.
        Местность сильно заслонённая и труднопроходимая.
        Если поджечь — вспыхивает и сгорает.
        На высоких кругах: радиус +10 футов за каждый круг выше 2-го.
    - name: "Дыхание боли"
      level: 3
      cost: "2 очка ци (через Скрытную рощу — бонусное действие)"
      description: >
        Бонусное действие, на себя, мгновенная.
        15-футовый конус шипов. Спасбросок Ловкости, при провале 3к6 колющего урона
        + уязвимость к колющему, дробящему и рубящему урону.
        При успехе — половина урона, без уязвимости.

monk_features:
  - name: "Защита без доспехов"
    description: "Если вы не носите доспех или щит, ваш КД = 10 + ЛОВ + МУД."
  - name: "Боевые искусства (краткий меч) (1к6)"
    description: >
      Можно Ловкость вместо Силы для бросков безоружных ударов и атак монашеским оружием.
      Кость боевых искусств для безоружных ударов или атак монашеским оружием.
      Если в свой ход вы используете действие для безоружной атаки или атаки монашеским оружием,
      вы можете совершить ещё одну безоружную атаку бонусным действием.
  - name: "Движение без доспехов"
    description: "Ваша скорость больше на 10 футов, если вы не носите доспехов и щит."
  - name: "Ци (2 очка)"
    description: >
      Вы можете использовать эти очки чтобы активировать умения ци.
      Вначале вам известны: Поступь ветра, Терпеливая оборона и Шквал ударов.
      Все потраченные очки ци восполняются после короткого+ отдыха.
      Вы должны потратить как минимум 30 минут на медитацию для их восстановления.
  - name: "Отражение снарядов"
    description: >
      Вы можете реакцией отразить или поймать снаряд, если по вам попали дальнобойной атакой.
      Если вы делаете это, урон снижается на 1к10 + ЛОВ + УР.
      Если вы снизили урон до 0, вы можете поймать снаряд, если он достаточно мал
      и одна из ваших рук свободна. Вы можете потратить одно очко ци, чтобы частью
      этой же реакции совершить дальнобойную атаку пойманным оружием до 60 футов.
      Вы совершаете эту атаку с владением, и этот снаряд считается монашеским оружием.
  - name: "Скрытная роща"
    description: >
      Вы можете потратить 2 очка ци, чтобы использовать заклинание Беспорядочный рост.
  - name: "Медленное падение"
    description: >
      Вы можете реакцией уменьшить урон от падения на значение, равное вашему уровню монаха,
      умноженному на пять.
  - name: "Ускоренное исцеление"
    description: >
      Действием вы можете потратить 2 очка ци и совершить бросок кости боевых искусств.
      Вы восстанавливаете количество хитов, равное результату броска кости боевых искусств
      + ваш бонус мастерства.
  - name: "Дополнительная атака"
    description: >
      Если вы в свой ход совершаете действие Атака, вы можете совершить две атаки вместо одной.
  - name: "Ошеломляющий удар"
    description: >
      Если вы попали по другому существу атакой рукопашным оружием, вы можете потратить
      1 очко ци, чтобы нанести ошеломляющий удар. Цель должна преуспеть в спасброске
      Телосложения, иначе она станет ошеломлённой до конца вашего следующего хода.
  - name: "Естественная гармония"
    description: >
      Вы можете использовать своё действие, создавая один из следующих эффектов:
      - Создать безобидный, мгновенный эффект, например, запах цветов или шелест листьев.
      - Вызвать цветение цветов или созревание плодов.
      - Изменить цвет растений на 1 минуту, внутри 5 футового куба.
      - Изменить форму растений на 1 минуту, внутри 5 футового куба.
  - name: "Энергетические удары"
    description: >
      Безоружные удары считаются магическими при определении преодоления сопротивления
      и иммунитета к немагическим атакам и урону.
  - name: "Спокойствие разума"
    description: >
      Вы можете Действием окончить один из действующих на вас эффектов,
      делающих вас очарованным или испуганным.

ki_abilities:
  - name: "Поступь ветра"
    cost: 1
    description: >
      Вы можете потратить 1 очко ци в свой ход, чтобы совершить бонусным действием
      Отход или Рывок. В этот ход дальность ваших прыжков удваивается.
  - name: "Терпеливая оборона"
    cost: 1
    description: >
      Вы тратите 1 очко ци в свой ход, чтобы совершить бонусным действием Уклонение.
  - name: "Шквал ударов"
    cost: 1
    description: >
      Сразу же после того, как вы в свой ход совершили действие Атака,
      вы можете потратить 1 очко ци, чтобы совершить бонусным действием две безоружные атаки.

grung_features:
  - name: "Ядовитая кожа"
    description: >
      Любое существо, которое вступает в прямой контакт с вашей кожей,
      должно преуспеть в спасброске Телосложения Сл 12 или стать отравленным на 1 минуту.
      Отравленное существо, которое больше не находится в непосредственном контакте с вами,
      может повторять Спасбросок в конце каждого своего хода, пока успешно его не пройдёт.
      Вы также можете нанести этот яд на любое колющее оружие частью атаки этим оружием;
      в таком случае яд сработает иначе. При попадании этой атакой цель должна преуспеть
      в спасброске Телосложения Сл 12, иначе получит 2к4 урона ядом.
  - name: "Амфибия"
    description: "Вы можете дышать воздухом и водой."
  - name: "Иммунитет к ядам"
    description: "Вы невосприимчивы к урону ядом и состоянию отравленный."
  - name: "Прыжок с места"
    description: "Ваш прыжок в длину может быть до 25 футов, а в высоту — до 15 футов."
  - name: "Зависимость от воды"
    description: >
      Если вам не удастся погрузиться в воду хотя бы на 1 час в течение дня,
      вы получаете одну степень истощения в конце этого дня.
      РЕШЕНИЕ: Дариус носит Квакена в бочке с водой на спине — вопрос решён.
  - name: "Увёртливость"
    description: >
      Ваше инстинктивное проворство позволяет вам уклоняться от эффектов,
      направленных на определённую область, вроде заклинания огненный шар.
      Если вы попадаете под действие эффекта, позволяющего совершить спасбросок Ловкости,
      чтобы получить только половину урона, вы вместо этого не получаете урона
      при успешном спасброске и получаете только половину урона при проваленном.

lucky:
  name: "Везунчик"
  description: >
    У вас есть 3 единицы удачи. Каждый раз, когда вы совершаете бросок атаки,
    проверку характеристики или спасбросок, вы можете потратить одну единицу удачи,
    чтобы бросить дополнительный к20 и выбрать любой из вариантов.
  points_max: 3
  points_current: 3

personality:
  traits: >
    Я вижу, как правда моих слов меняет повседневность.
    Я не понимаю тех, кто отказывается верить в высшие силы, правящие миром.
  ideals: "Мои откровения развеивают тьму во всех уголках мира."
  bonds: >
    Однажды целый орден моей религии проповедовал мои откровения,
    но я стал последним из них.
  flaws: >
    Моя преданность откровениям настолько высока,
    что я порой рискую собственной безопасностью ради них.

organization:
  description: >
    Вы видели правду и ваши слова несут эту правду в мир. Но что важнее,
    эта правда наставляют других на действия. Люди, которые слышат и принимают
    ваши слова становятся целенаправленными. Подобные люди будут предлагать помощь
    и услуги вашему делу, будь то построением нового храма, расчисткой завалов после
    шторма или же кормлением голодных. Однако, лишнему риску они подвергать себя
    не будут. Обычно храмы и прочие религиозные организации принимают пророков
    своей веры, а аристократия, торговцы, торговые гильдии и подобные организации
    могут помочь ресурсами.
    Кроме того, вы можете добиться аудиенций с влиятельными людьми или при приглашении
    на мероприятия, которые обычно были бы гораздо выше вас по статусу.
    От тех же, кто боится или опровергает вашу точку зрения, вы можете ожидать
    социальной враждебности, хотя многие могут попросту бояться выступать против вас
    в открытую.

